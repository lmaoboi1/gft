<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Gift Reveal Animation</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* We need a few custom styles for the 3D flip animation 
          that aren't included in Tailwind by default.
        */

        /* Apply 3D perspective to the card container */
        .card {
            perspective: 1000px;
            cursor: pointer; /* Add pointer cursor to show it's clickable */
        }

        /* This is the inner element that does the actual flipping */
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s;
            transform-style: preserve-3d; /* Allows 3D transformations */
        }

        /* This class is added by JavaScript to trigger the flip */
        .card.revealed .card-inner {
            transform: rotateY(180deg);
        }

        /* Both front and back faces are absolutely positioned */
        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; /* For Safari */
            backface-visibility: hidden; /* Hides the back of the element when it's not facing the camera */
            border-radius: 0.75rem; /* rounded-xl */
            overflow: hidden; /* Ensures image corners are rounded */
        }

        /* The back face is pre-rotated 180 degrees */
        .card-back {
            transform: rotateY(180deg);
        }

        /* Keyframe animation for the lightning flash */
        @keyframes flash {
            0% { 
                transform: translate(-50%, -50%) scale(0); 
                opacity: 0; 
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.5); 
                opacity: 0.7; 
            }
            100% { 
                transform: translate(-50%, -50%) scale(2.5); 
                opacity: 0; 
            }
        }

        /* Utility class to apply the animation */
        .flash-animation {
            /* This is a white radial gradient, creating a soft circular flash */
            background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 60%);
            animation: flash 0.4s ease-out;
            border-radius: 50%;
        }

        /* TikTok-like background swooshes */
        .swoosh {
            position: fixed;
            width: 300%;
            height: 50vh;
            opacity: 0.3;
            filter: blur(100px); /* Soft blurred effect */
            z-index: 0;
        }

        .swoosh-cyan {
            background-color: #00f2ea;
            top: -20vh;
            left: -50%;
            transform: rotate(-30deg);
        }

        .swoosh-red {
            background-color: #ff0050;
            top: 10vh;
            right: -50%;
            transform: rotate(-30deg);
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicking through the canvas */
            z-index: 999;
        }
    </style>
</head>

    <script>
        // --- Confetti Animation Logic ---
        const confettiCanvas = document.getElementById('confetti-canvas');
        const ctx = confettiCanvas.getContext('2d');
        let particles = [];
        const colors = ['#00f2ea', '#ff0050', '#a855f7', '#3b82f6', '#ffffff'];

        function resizeCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 5 + 5; // size between 5 and 10
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.vx = Math.random() * 10 - 5; // horizontal velocity
                this.vy = Math.random() * -10 - 5; // vertical velocity (upwards)
                this.opacity = 1;
                this.gravity = 0.2;
            }

            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.opacity -= 0.01;
            }

            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function createParticles() {
            const particleCount = 200;
            const centerX = confettiCanvas.width / 2;
            const centerY = confettiCanvas.height / 2;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle(centerX, centerY));
            }
        }

        let animationFrameId = null;
        function animateConfetti() {
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            
            particles.forEach((particle, index) => {
                particle.update();
                particle.draw();

                if (particle.opacity <= 0 || particle.y > confettiCanvas.height) {
                    particles.splice(index, 1);
                }
            });

            if (particles.length > 0) {
                animationFrameId = requestAnimationFrame(animateConfetti);
            } else {
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height); // Clear one last time
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }

        function startConfetti() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                particles = []; // Clear old particles
            }
            resizeCanvas();
            createParticles();
            animateConfetti();
        }

        // Adjust canvas size on window resize
        window.addEventListener('resize', resizeCanvas);


        // --- Main Game Logic ---
        window.addEventListener('DOMContentLoaded', () => {
            
            // Get all the elements we need
            const cards = document.querySelectorAll('.card');
            const grid = document.getElementById('gift-grid');
            const form = document.getElementById('claim-form');
            const flashEffect = document.getElementById('flash-effect');
            const claimButton = document.getElementById('claim-button');
            const successMessage = document.getElementById('success-message');

            let revealedCount = 0;

            // Loop through each card and add a click listener
            cards.forEach((card, index) => {
                card.addEventListener('click', () => {
                    // Do nothing if the card is already revealed
                    if (card.classList.contains('revealed')) {
                        return;
                    }

                    // Reveal the card
                    card.classList.add('revealed');
                    revealedCount++;

                    // On the very first card (index 0), trigger the flash effect
                    if (index === 0) {
                        flashEffect.classList.add('flash-animation');
                        // Clean up the animation class after it runs
                        setTimeout(() => flashEffect.classList.remove('flash-animation'), 400);
                    }
                    
                    // If all cards are revealed, show the form
                    if (revealedCount === cards.length) {
                        // After the last card's animation has started,
                        // fade out the grid and fade in the form.
                        setTimeout(() => {
                            // Fade out the grid
                            grid.classList.add('opacity-0', 'pointer-events-none');
                            
                            // Fade in the form
                            form.classList.remove('opacity-0', 'pointer-events-none');
                            form.classList.add('opacity-100');

                        }, 700); // 700ms after the last flip starts, for a smooth transition
                    }
                });
            });

            // Add click listener for the claim button
            claimButton.addEventListener('click', () => {
                // Animate out the form: fade, scale down, and blur
                form.classList.remove('opacity-100');
                form.classList.add('opacity-0', 'pointer-events-none', 'scale-90', 'blur-sm');

                // After a short delay, animate in the success message
                setTimeout(() => {
                    // Animate in the success message: fade in, scale to normal, and remove blur
                    successMessage.classList.remove('opacity-0', 'pointer-events-none', 'scale-110', 'blur-sm');
                    successMessage.classList.add('opacity-100', 'scale-100', 'blur-0');

                    // Start the confetti *with* the success message!
                    startConfetti();
                }, 300); // 300ms delay for a more cinematic feel
            });
        });
    </script>
